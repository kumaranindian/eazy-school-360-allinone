name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Dependency advisories (OSV, Dart packages)
        run: python3 tool/osv_scan_pub.py
      - name: Web release build
        run: flutter build web --release

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: npm install -g firebase-tools
      - run: flutter pub get
      # Regenerates the Dart-written write-plan fixtures the contract tests replay.
      - name: Export contract fixtures
        run: flutter test test/communication/communication_write_contract_test.dart test/exams/exam_write_contract_test.dart test/homework/homework_write_contract_test.dart test/leave/leave_write_contract_test.dart test/timetable/timetable_write_contract_test.dart
      - run: npm ci
        working-directory: firestore-tests
      # Test tooling only (never shipped). Known high findings are tracked in
      # docs/milestone-12a-blocker-closure.md; fail the build on critical.
      - name: npm audit (critical)
        run: npm audit --audit-level=critical
        working-directory: firestore-tests
      - name: Firestore and Storage rules (serial, emulator)
        run: firebase emulators:exec --only firestore,storage --project demo-eazy-school-360 "cd firestore-tests && npm test"
      # The released ruleset is the comment-free build. It must stay under the
      # service's size limit (fails above 85 %) and behave exactly like the source.
      - name: Build deployable rules (size gate) and unit-test the minifier
        run: node --test "tool/*.test.js" && node tool/build_rules.js --check
      - name: Rules suite against the built (deployable) rules
        run: RULES_FILE=../build/rules/firestore.rules STORAGE_RULES_FILE=../build/rules/storage.rules firebase emulators:exec --only firestore,storage --project demo-eazy-school-360 "cd firestore-tests && npm test"

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - name: Cloud Functions tests
        run: npm test
        working-directory: functions
