name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the jobs only read the repository (CFG-7).
permissions:
  contents: read

# A newer push to the same PR/branch supersedes a running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      # Dates are civil dates; a UTC-only run hides time-zone bugs (ACAD-1).
      - name: Date-sensitive tests in other time zones
        run: |
          for tz in Asia/Kolkata America/Los_Angeles Pacific/Auckland; do
            TZ=$tz flutter test test/academic_setup test/leave test/timetable test/attendance test/exams test/regional
          done
      - name: Dependency advisories (OSV, Dart packages)
        run: python3 tool/osv_scan_pub.py
      # The production entry point, as it is released (CFG-8).
      - name: Web release build (prod entry)
        run: flutter build web --release -t lib/main_prod.dart --dart-define=APP_ENV=prod

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get
      # Catches manifest / Gradle / plugin breakage. A debug build needs no
      # signing key; release builds refuse to run without one (CFG-1).
      - name: Android debug build
        run: flutter build apk --debug -t lib/main_dev.dart --dart-define=APP_ENV=dev

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      # Pinned: an unpinned global install can change under a green build.
      - run: npm install -g firebase-tools@15.33.0
      - run: flutter pub get
      # Regenerates the Dart-written write-plan fixtures the contract tests replay.
      - name: Export contract fixtures
        run: flutter test test/communication/communication_write_contract_test.dart test/exams/exam_write_contract_test.dart test/homework/homework_write_contract_test.dart test/leave/leave_write_contract_test.dart test/timetable/timetable_write_contract_test.dart test/students/branch_transfer_write_contract_test.dart
      - run: npm ci
        working-directory: firestore-tests
      # Test tooling only (never shipped). Known high findings are tracked in
      # docs/milestone-12a-blocker-closure.md; fail the build on critical.
      - name: npm audit (critical)
        run: npm audit --audit-level=critical
        working-directory: firestore-tests
      - name: Firestore and Storage rules (serial, emulator)
        run: firebase emulators:exec --only firestore,storage --project demo-eazy-school-360 "cd firestore-tests && npm test"
      # The released ruleset is the comment-free build. It must stay under the
      # service's size limit (fails above 85 %) and behave exactly like the source.
      - name: Build deployable rules (size gate) and unit-test the minifier
        run: node --test "tool/*.test.js" && node tool/build_rules.js --check
      - name: Rules suite against the built (deployable) rules
        run: RULES_FILE=../build/rules/firestore.rules STORAGE_RULES_FILE=../build/rules/storage.rules firebase emulators:exec --only firestore,storage --project demo-eazy-school-360 "cd firestore-tests && npm test"

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - name: Cloud Functions tests
        run: npm test
        working-directory: functions
